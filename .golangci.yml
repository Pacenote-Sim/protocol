# golangci-lint v2 configuration. Validate with: golangci-lint config verify
#
# Copied from the capture client and adapted: same linters, same settings, same
# standards. Only the dependency rules differ, because this module has a
# different shape — two packages, one of which may see zstd and one of which may
# see nothing at all.
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

output:
  show-stats: true

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errcheck
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - govet
    - ineffassign
    - intrange
    - nilerr
    - nolintlint
    - paralleltest
    - prealloc
    - revive
    - staticcheck
    - testifylint
    - thelper
    - unparam
    - unused
    - wrapcheck

  settings:
    depguard:
      # The dependency rule of this module, which is nearly all of its
      # architecture: wire is types and nothing else, trace is wire plus one
      # compressor, and neither may grow a third-party dependency without this
      # file saying so. Every rule below is "strict": only the listed packages
      # may be imported from the matched files.
      rules:
        wire-is-stdlib-only:
          list-mode: strict
          files:
            - "!$test"
            - "**/wire/**"
          allow:
            - $gostd
        trace-imports-wire-and-zstd:
          list-mode: strict
          files:
            - "!$test"
            - "**/trace/**"
          allow:
            - $gostd
            - github.com/pacenote-sim/protocol/wire
            - github.com/klauspost/compress/zstd
        tests-use-testing-deps-only:
          list-mode: strict
          # depguard ORs the positive globs, so "$test" alone would match every
          # file in the module; the two globs below keep this rule on tests.
          files:
            - "**/wire/**_test.go"
            - "**/trace/**_test.go"
          allow:
            - $gostd
            - github.com/pacenote-sim/protocol
            - github.com/klauspost/compress/zstd
            - github.com/stretchr/testify
            - go.uber.org/goleak
            # depguard matches $gostd by nearest sorted prefix; "go.uber.org/goleak"
            # sorts between "go" and "go/build" and would shadow the go/* stdlib
            # tree, so it is listed explicitly for the AST-walking tests.
            - go/
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam        # TracePoint is passed by value on purpose: it is the wire type
        - unnamedResult
    gosec:
      excludes:
        - G104 # duplicates errcheck
    govet:
      enable-all: true
      disable:
        - fieldalignment # the wire structs are frozen layouts, not packing puzzles
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    paralleltest:
      ignore-missing: false
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
    staticcheck:
      checks:
        - all
        - -ST1000 # package comments are checked by revive
    testifylint:
      enable-all: true
    thelper:
      test:
        first: true
        name: true
        begin: true
    unparam:
      check-exported: false
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Join(
        - errors.Unwrap(

  exclusions:
    generated: lax
    warn-unused: false
    rules:
      - path: _test\.go
        linters:
          - wrapcheck
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Report every issue on a line: with the default (true) a depguard violation is
  # hidden whenever another linter reports on the same line, and the dependency
  # rule is the one gate that must not hide.
  uniq-by-line: false

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/pacenote-sim/protocol
      extra-rules: false
    goimports:
      local-prefixes:
        - github.com/pacenote-sim/protocol
